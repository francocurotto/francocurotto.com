# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name francocurotto.com www.francocurotto.com;

    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name francocurotto.com www.francocurotto.com;

    root /var/www/francocurotto.com/content;
    index index.shtml index.html;

    ssi on;

    location / {
        try_files $uri $uri.html $uri.shtml $uri/ =404;
    }

    # SSL (Certbot)
    ssl_certificate /etc/letsencrypt/live/francocurotto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/francocurotto.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
